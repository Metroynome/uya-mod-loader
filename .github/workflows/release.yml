name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -t uya-mod-loader .
      - name: Build and package all regions
        run: docker run --rm --network none -v "$PWD:/workspace" uya-mod-loader make release
      - name: Validate release archives
        run: docker run --rm --network none -v "$PWD:/workspace" uya-mod-loader make check-release
      - uses: actions/upload-artifact@v4
        with:
          name: uya-mod-loader-release
          path: release/zips/*
          if-no-files-found: error
          compression-level: 0
      - name: Attach archives to a draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/zips/* --clobber
          else
            gh release create "$TAG" release/zips/* --draft --verify-tag --title "$TAG" --generate-notes
          fi
